<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMS | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card { border-radius: 15px; border: none; }
        .form-control { padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container p-3"> <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4"> 
            <div class="card shadow-lg">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4 fw-bold">BMS Login</h3>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            {{ form.as_p }}
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">Login</button>
                    </form>
                    <div class="mt-4 text-center small">
                        Don't have an account? <a href="{% url 'signup' %}" class="fw-bold text-decoration-none">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
